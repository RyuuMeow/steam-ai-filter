name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (for example v0.7.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify release version
        id: release
        run: npm run release:check -- "$RELEASE_TAG"
      - run: npm ci
      - run: npm run check
      - name: Install RAR
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes rar
      - name: Build and verify plugin RAR
        run: npm run package:rar
      - name: Publish plugin RAR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Steam AI Filter $RELEASE_TAG" \
            --notes-file .github/release-notes.md \
            --latest
