<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steam AI Filter · 遮蔽與剔除</title>
<link rel="stylesheet" href="/dist/content.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f3f6f8; color: #222435; font: 14px/1.5 "Segoe UI", "Microsoft JhengHei", sans-serif; }
main { max-width: 1000px; padding: 32px 24px; margin: auto; }
h1 { margin: 0 0 24px; font-size: 22px; }
.layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
iframe { width: 320px; height: 400px; border: 0; border-radius: 12px; }
.store { padding: 20px; border-radius: 12px; background: #182738; color: #d6e4f1; }
.catalog { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { display: block; position: relative; border-radius: 8px; overflow: hidden; background: #345064; color: inherit; text-decoration: none; }
.card img { display: block; width: 100%; height: 96px; background: linear-gradient(130deg, #42687d, #5e8a8c); }
.title { display: block; padding: 12px; }
pre { white-space: pre-wrap; font: 12px/1.6 Consolas, monospace; }
</style>
<main>
  <h1>Steam AI Filter · 遮蔽／剔除預覽</h1>
  <div class="layout">
    <iframe src="/preview-popup.html" title="插件彈窗預覽"></iframe>
    <div class="store">
      <div class="catalog">
        <a class="card" id="disclosed" href="https://store.steampowered.com/app/701/" aria-label="Original game link">
          <img alt="Generated Worlds" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
          <span class="title">Generated Worlds</span>
          <div class="game_area_description" hidden><h2>AI Generated Content Disclosure</h2><i>Demo disclosure: generated art.</i></div>
        </a>
        <a class="card" id="tagged" href="https://store.steampowered.com/app/702/" data-ds-tagids="[7926]">
          <img alt="Signal Garden" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><span class="title">Signal Garden</span>
        </a>
        <a class="card" id="unknown" href="https://store.steampowered.com/app/703/">
          <img alt="Quiet Valley" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><span class="title">Quiet Valley</span>
        </a>
        <a class="card" id="allowed" href="https://store.steampowered.com/app/704/" data-ds-tagids="[7926]">
          <img alt="Allowed game" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><span class="title">Allowed game</span>
        </a>
        <a class="card" id="duplicate" href="https://store.steampowered.com/app/701/">
          <img alt="Generated Worlds again" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><span class="title">Generated Worlds again</span>
        </a>
      </div>
    </div>
  </div>
  <pre id="test-results"></pre>
</main>
<script src="/tests/bridge.js"></script>
<script src="/tests/removal-setup.js"></script>
<script src="/dist/lookup.js"></script><script src="/dist/core.js"></script>
<script src="/dist/mask.js"></script><script src="/dist/layout.js"></script><script src="/dist/content.js"></script>
<script src="/tests/removal.js"></script>
</html>
