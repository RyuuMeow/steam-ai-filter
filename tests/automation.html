<!doctype html><html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steam AI Filter · 自動忽略與檢查標記</title>
<link rel="stylesheet" href="/dist/content.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#172b3c;color:#e7f0f8;font:14px/1.5 system-ui}
main{max-width:900px;margin:28px 372px 28px 28px}h1{font-size:22px;margin:0 0 18px}h2{font-size:16px;margin:0 0 12px}
header{display:flex;gap:12px;align-items:center}header img{width:32px;height:32px}
iframe{position:fixed;right:24px;top:24px;width:320px;height:650px;border:0;border-radius:12px;background:white}
a{color:inherit;text-decoration:none}.trailercarousel{margin:12px 0 24px;padding:14px;background:#294256;border-radius:8px}
.trailer-game{display:flex;gap:18px;min-height:210px}.trailer-media{width:52%;position:relative}.trailer-media video{width:100%;height:205px;background:#172b3c;object-fit:cover}
.description{flex:1}.description>a>img{width:100%;height:80px;object-fit:cover}.description p{margin:10px 0}.description button{padding:8px 12px}
.trailer-navigation{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.game{position:relative;display:block;min-height:160px;background:#2e495e;border-radius:6px;overflow:hidden}
.game img{width:100%;height:115px;display:block;object-fit:cover}.game .title{display:block;padding:8px 10px}.game .game_area_description{display:none}
pre{white-space:pre-wrap;font-size:12px;margin:20px 0}.preview-note{color:#b6c9da;margin:12px 0}
@media(max-width:1000px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<main>
<header><img src="/dist/icons/icon32.png" alt=""><h1>預告片與已檢查標記</h1></header>
<div id="trailer-slot"></div>
<div class="games" id="games"></div>
<p class="preview-note">離線示範：測試資料不會修改 Steam 帳號。</p>
<pre id="test-results"></pre>
</main>
<script src="/tests/bridge.js"></script>
<script src="/dist/lookup.js"></script><script src="/dist/disclosure-keywords.js"></script><script src="/dist/disclosure.js"></script><script src="/dist/core.js"></script><script src="/dist/ignore.js"></script>
<script src="/tests/automation-setup.js"></script>
<script src="/dist/mask.js"></script><script src="/dist/layout.js"></script><script src="/dist/content.js"></script>
<iframe src="/preview-popup.html" title="Steam AI Filter 設定"></iframe>
<script src="/tests/automation.js"></script>
</html>
