<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steam AI Filter</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
  <script src="disclosure-keywords.js" defer></script>
  <script src="disclosure.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="core.js" defer></script>
  <script src="select.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header class="panel-header">
      <button id="back" class="icon-button" data-i18n-aria="nav.backLabel" data-i18n-title="nav.back" hidden>
        <img src="icons/back.svg" width="20" height="20" alt="">
      </button>
      <h1 id="page-title" tabindex="-1">AI 過濾</h1>
      <button id="settings" class="icon-button" data-open="settings" data-i18n-aria="category.settings" data-i18n-title="category.settings">
        <img src="icons/settings.svg" width="20" height="20" alt="">
      </button>
    </header>
    <section data-view="home">
      <div class="filter-control" data-level="2">
        <div class="slider-shell">
          <div class="track" aria-hidden="true"><div class="fill"></div><div class="dots"><i></i><i></i><i></i><i></i></div></div>
          <div class="slider-thumb" aria-hidden="true"></div>
          <input id="strength" type="range" min="0" max="3" step="any" value="2" disabled data-i18n-aria="mode.label">
        </div>
        <div class="stops" aria-hidden="true"><span data-i18n="mode.off"></span><span data-i18n="mode.mark"></span><span data-i18n="mode.mask"></span><span data-i18n="mode.hide"></span></div>
      </div>
      <section id="filter-options" aria-labelledby="filter-title">
        <h2 id="filter-title" data-i18n="filter.title"></h2>
        <div id="category-list" role="group" data-i18n-aria="filter.title"></div>
      </section>
    </section>
    <section data-view="settings" hidden>
      <nav class="settings-list" data-i18n-aria="nav.categories">
        <button data-open="checking"><span data-i18n="category.checking"></span><img src="icons/right.svg" alt=""></button>
        <button data-open="network"><span data-i18n="category.network"></span><img src="icons/right.svg" alt=""></button>
        <button data-open="display"><span data-i18n="category.display"></span><img src="icons/right.svg" alt=""></button>
        <button data-open="automation"><span data-i18n="category.automation"></span><img src="icons/right.svg" alt=""></button>
        <button data-open="language"><span data-i18n="category.language"></span><img src="icons/right.svg" alt=""></button>
      </nav>
    </section>
    <section data-view="checking" hidden>
      <div class="field"><label for="cache-days" data-i18n="label.cacheDays"></label>
        <select id="cache-days" disabled><option value="0" data-i18n="option.cacheDefault"></option><option value="1"></option><option value="7"></option><option value="30"></option></select>
      </div>
      <button id="clear-cache" class="text-button" disabled data-i18n="action.clearCache"></button>
      <p id="cache-result" role="status" hidden></p>
    </section>
    <section data-view="network" hidden>
      <div class="field"><label for="request-gap" data-i18n="label.requestGap"></label>
        <select id="request-gap" disabled><option value="700"></option><option value="1000"></option><option value="2000"></option><option value="5000"></option></select>
      </div>
      <div class="field"><label for="concurrency" data-i18n="label.concurrency"></label>
        <select id="concurrency" disabled><option value="1">1</option><option value="2">2（預設）</option><option value="3">3</option><option value="4">4</option></select>
      </div>
    </section>
    <section data-view="display" hidden>
      <label class="toggle-row" for="show-checked"><span data-i18n="label.showChecked"></span><input id="show-checked" type="checkbox" role="switch" checked disabled></label>
      <label class="toggle-row" for="hover-reveal"><span data-i18n="label.hoverReveal"></span><input id="hover-reveal" type="checkbox" role="switch" disabled></label>
    </section>
    <section data-view="automation" hidden>
      <label class="toggle-row" for="auto-ignore"><span data-i18n="label.autoIgnore"></span><input id="auto-ignore" type="checkbox" role="switch" disabled aria-describedby="ignore-rule"></label>
      <p id="ignore-rule" class="help" data-i18n="automation.warning"></p>
      <p id="ignore-status" role="status" hidden></p>
      <section id="exceptions" aria-labelledby="exceptions-title" hidden>
        <h2 id="exceptions-title" data-i18n="allow.title"></h2><ul id="allow-list"></ul>
      </section>
    </section>
    <section data-view="language" hidden>
      <div class="field"><label for="language" data-i18n="label.language"></label>
        <select id="language" disabled><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option></select>
      </div>
    </section>
    <p id="connection" role="status" hidden></p>
    <p id="error" role="alert" hidden></p>
  </main>
</body>
</html>
